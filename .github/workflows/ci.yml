name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.wav"
      - "**/*.mp3"
      - "**/*.flac"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.gif"
  pull_request:
    paths-ignore:
      - "**/*.wav"
      - "**/*.mp3"
      - "**/*.flac"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.gif"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify
        env:
          UV_PYTHON: "3.12"
        run: make verify
