[project]
name = "angeleno"
version = "0.1.1"
description = "Angeleno / Jo standalone conversation and realtime voice candidate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.8.4",
    "livekit>=1.0,<2",
    "livekit-api>=1.0,<2",
    "livekit-protocol>=1.0,<2",
    "aiohttp>=3.10,<4",
    "httpx==0.28.1",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fastapi>=0.115,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
