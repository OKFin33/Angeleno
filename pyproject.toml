[project]
name = "angeleno"
version = "0.1.1"
description = "A character-driven realtime voice companion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.8.4",
    "livekit>=1.0,<2",
    "livekit-api>=1.0,<2",
    "livekit-protocol>=1.0,<2",
    "aiohttp>=3.10,<4",
    "httpx==0.28.1",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fastapi>=0.115,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
angeleno = "angeleno.__main__:entrypoint"
angeleno-voice = "angeleno.launcher:main"
angeleno-trace = "angeleno.trace:main"

[tool.hatch.build.targets.wheel]
packages = ["src/angeleno"]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "angeleno/_resources/.env.example"
"characters" = "angeleno/_resources/characters"
"data" = "angeleno/_resources/data"
"examples" = "angeleno/_resources/examples"
"web" = "angeleno/_resources/web"
"LICENSES" = "angeleno/_resources/LICENSES"
"NOTICE" = "angeleno/_resources/NOTICE"

[tool.hatch.build.targets.sdist]
include = ["/src", "/characters", "/data", "/examples", "/web", "/LICENSES", "/LICENSE", "/NOTICE", "/README.md", "/pyproject.toml", "/.env.example"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
