<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Angeleno</title><style>
:root { font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#f1f5f5; background:#0d171c; font-size:15px; font-synthesis:none; --bg:#111e24; --panel:#213138; --line:#3b4b51; --sub:#b5c2c6; --green:#25b590; --red:#eb3c55}

body { margin:0; background:var(--bg); height:100dvh; overflow:hidden}

.screen { height:100dvh; min-height:560px; display:flex; flex-direction:column; max-width:480px; margin:auto; position:relative; background:linear-gradient(165deg,#15252c 0%,#111e24 45%,#122128 100%)}

<main class="screen" aria-label="一对一语音通话">
<header class="top"><h1 id="personaName" class="name">Angeleno</h1><p id="disclosure" class="identity">虚构人物 · 早期版本 · 正在加载人物配置</p><p id="statusText" class="status" role="status">正在检查服务</p><p id="timer" class="timer">00:00</p></header>
<div class="stage"><div class="portrait" aria-hidden="true"><span id="portraitLetter">J</span></div></div>
<div id="toast" role="status" hidden></div>
<section id="sourceCard" class="shared" hidden aria-label="当前查证" aria-live="polite"></section>
<footer class="controls"><div class="control-row"><button id="muteButton" class="control mute-control" hidden aria-label="静音麦克风" aria-pressed="false">静音</button><div class="control"><button id="micButton" class="circle" aria-label="开始对话" data-active="false"><svg aria-hidden="true"><use href="#i-phone"/></svg></button><span id="callLabel">开始通话</span></div></div><details class="captions"><summary>字幕</summary><p id="transcript"></p></details></footer>
</main>
<input id="modelSelect" type="hidden" value="deepseek">
<audio id="remoteAudio" autoplay playsinline></audio>
<script src="livekit-client.umd.js"></script>
<script>
function bootAngeleno() {
    'use strict';

    const MODEL_NAMES = {deepseek: '人物'};
    const modelSelect = document.getElementById('modelSelect');
    const micButton = document.getElementById('micButton');
    const muteButton = document.getElementById('muteButton');
    const callLabel = document.getElementById('callLabel');
    const statusText = document.getElementById('statusText');
    const timerEl = document.getElementById('timer');
    const toastEl = document.getElementById('toast');
    const transcriptEl = document.getElementById('transcript');
    const remoteAudio = document.getElementById('remoteAudio');
    let toastTimeout = null;
    function clearToast() {
        clearTimeout(toastTimeout); toastTimeout = null;
        toastEl.hidden = true; toastEl.textContent = '';
    }
    function showToast(text) {
        clearToast();
        toastEl.textContent = text; toastEl.hidden = false;
        const generation = callGeneration;
        const timeout = setTimeout(() => {
            if (generation === callGeneration && toastTimeout === timeout) clearToast();
        }, 6000);
        toastTimeout = timeout;
    }
    function updateMuteControl(enabled) {
        muteButton.textContent = enabled ? '静音' : '取消静音';
        muteButton.setAttribute('aria-pressed', String(!enabled));
        muteButton.setAttribute('aria-label', enabled ? '静音麦克风' : '取消静音');
    }
    function updatePersona(health) {
        if (typeof health.persona_label !== 'string' || !health.persona_label) return;
        MODEL_NAMES.deepseek = health.persona_label;
        document.title = 'Angeleno · ' + health.persona_label;
        document.getElementById('personaName').textContent = health.persona_label;
        document.getElementById('portraitLetter').textContent = Array.from(health.persona_label)[0];
        document.getElementById('disclosure').textContent = health.persona_label + ' · 虚构人物 · 早期版本';
    }
    function modelDisplayName() { return MODEL_NAMES.deepseek; }
    function setStatus(state, text) {
        const name = modelDisplayName();
        const labels = {ready:'语音通话', connecting: connecting || connected ? '正在连接' : '正在检查服务',
            connected:name + ' 对话中', disconnected:'通话已结束', error:'暂时无法通话'};
        statusText.textContent = text || labels[state] || labels.error;
        micButton.dataset.active = String(connected || connecting);
    }
    let timerInterval = null, connectStart = 0;
    function startTimer() {
        connectStart = Date.now(); timerEl.textContent = '00:00';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const seconds = Math.floor((Date.now() - connectStart) / 1000);
            timerEl.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
        }, 500);
    }
    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
    function showTranscript(text) {
        if (typeof text === 'string' && text) transcriptEl.textContent = text;
    }
    let audioContext = null;
    let analyser = null;
    let freqData = null;
    let remoteSourceNode = null;   // createMediaElementSource — once per element
    let micSourceNode = null;

    function ensureAudioGraph() {
        if (audioContext) {
            if (audioContext.state === 'suspended') audioContext.resume();
            return;
        }
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.55;
        freqData = new Uint8Array(analyser.frequencyBinCount);

        // remote AI voice (primary, gain 1.0) — element output is rerouted
        // through the graph, so also connect to destination to stay audible
        const remoteGain = audioContext.createGain();
        remoteGain.gain.value = 1.0;
        try {
            remoteSourceNode = audioContext.createMediaElementSource(remoteAudio);
            remoteSourceNode.connect(remoteGain);
            remoteGain.connect(analyser);
            remoteGain.connect(audioContext.destination);
        } catch (err) {
            console.warn('remote audio analyser hookup failed', err);
        }
        audioContext._micGain = audioContext.createGain();
        audioContext._micGain.gain.value = 0.3; // local mic, secondary
        audioContext._micGain.connect(analyser); // NOT to destination (no feedback)
    }

    function connectMicToAnalyser(mediaStreamTrack) {
        if (!audioContext || !mediaStreamTrack) return;
        try {
            const stream = new MediaStream([mediaStreamTrack]);
            micSourceNode = audioContext.createMediaStreamSource(stream);
            micSourceNode.connect(audioContext._micGain);
        } catch (err) {
            console.warn('mic analyser hookup failed', err);
        }
    }

    function disconnectMicFromAnalyser() {
        if (micSourceNode) {
            try { micSourceNode.disconnect(); } catch (_) {}
            micSourceNode = null;
        }
    }

    const TOKEN_URL = window.location.origin + '/token';
    // The server supplies the client URL; localhost is not the phone's server.

    const SOURCE_TOPIC = 'angeleno.source';
    let sourceSession = '', sourceAgent = '', sourceSequence = 0;
    let sourcePhase = '', sourceHeading = null;
    let turnSession = '', turnAgent = '', turnSequence = 0;
    function resetSourceCard() {
        sourceSession = ''; sourceAgent = ''; sourceSequence = 0;
        sourcePhase = ''; sourceHeading = null;
        turnSession = ''; turnAgent = ''; turnSequence = 0;
        const panel = document.getElementById('sourceCard');
        panel.replaceChildren(); panel.hidden = true;
        document.getElementById('transcript').textContent = '';
    }
    function receiveTurnStatus(payload, participant, _kind, topic) {
        if (topic !== 'angeleno.turn_status' || !participant || !participant.isAgent || !participant.identity
            || !payload || payload.byteLength > 2000) return;
        let event;
        try { event = JSON.parse(new TextDecoder('utf-8', {fatal: true}).decode(payload)); }
        catch (_) { return; }
        if (!event || event.type !== topic || event.recipient !== localIdentity
            || typeof event.session_id !== 'string' || !event.session_id
            || !Number.isSafeInteger(event.sequence) || event.sequence <= turnSequence
            || !['started', 'response_timeout', 'lookup_timeout'].includes(event.state)) return;
        if (turnSession && (turnSession !== event.session_id || turnAgent !== participant.identity)) return;
        turnSession = event.session_id; turnAgent = participant.identity; turnSequence = event.sequence;
        if (event.state === 'started') setStatus('connected');
        else {
            const message = event.state === 'lookup_timeout' ? '这次核对回应超时，请继续说或换个问题' : '这次回应超时，请继续说';
            setStatus('connected', message); showToast(message);
        }
    }
    function receiveSourceCard(payload, participant, _kind, topic) {
        if (topic !== SOURCE_TOPIC || !participant || !participant.isAgent || !participant.identity) return;
        if (!payload || payload.byteLength > 14000) return;
        let event;
        try { event = JSON.parse(new TextDecoder('utf-8', {fatal: true}).decode(payload)); }
        catch (_) { return; }
        if (!event || event.type !== SOURCE_TOPIC || event.recipient !== localIdentity
            || !Number.isSafeInteger(event.sequence) || event.sequence <= sourceSequence) return;
        const card = event.card;
        const labels = {evidence: '已取得资料', supported: '有依据', insufficient: '信息不足', conflict: '来源冲突',
            unavailable: '来源暂不可用', out_of_scope: '超出当前范围', cancelled: '已取消'};
        if (!card || typeof card.session_id !== 'string' || !card.session_id
            || typeof card.request_id !== 'string' || !card.request_id
            || typeof card.subject !== 'string' || !Array.isArray(card.citations)
            || !Array.isArray(card.conflicts) || card.citations.length > 8
            || !['checking', 'result'].includes(card.phase)
            || (card.phase === 'result' && !Object.hasOwn(labels, card.status))) return;
        if (sourceSession && (sourceSession !== card.session_id || sourceAgent !== participant.identity)) return;
        if (card.status === 'supported' && (typeof card.conclusion !== 'string' || !card.conclusion || !card.citations.length)) return;
        const panel = document.getElementById('sourceCard');
        const body = document.createElement('div');
        const add = (tag, text, parent = body) => {
            const node = document.createElement(tag); node.textContent = text; parent.appendChild(node); return node;
        };
        const heading = add('h2', card.phase === 'checking' ? '正在核对' : labels[card.status]);
        add('p', card.subject).className = 'card-title';
        if (card.phase === 'result' && card.status !== 'cancelled' && typeof card.conclusion === 'string') add('p', card.conclusion);
        if (typeof card.applicable_date === 'string') add('small', '适用日期 · ' + card.applicable_date);
        if (typeof card.checked_at === 'string') add('small', '核对时间 · ' + card.checked_at);
        if (card.phase === 'result' && card.status !== 'cancelled' && card.citations.length) {
            const details = add('details', ''); add('summary', '查看来源', details);
            for (const citation of card.citations) {
                if (!citation || typeof citation.url !== 'string' || typeof citation.name !== 'string') continue;
                let url; try { url = new URL(citation.url); } catch (_) { continue; }
                if (url.protocol !== 'https:' || url.username || url.password) continue;
                const p = add('p', '', details), link = add('a', citation.name, p);
                link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
                if (citation.claim_kind === 'search_summary') add('small', card.status === 'unavailable'
                    ? '搜索摘要，页面未读到／未核验' : '搜索摘要，尚未读取正文', details);
                if (citation.claim_kind === 'fetched_page') add('small', '由搜索服务读取；最终地址和跳转过程未提供', details);
                if (typeof citation.excerpt === 'string') add('p', citation.excerpt, details);
            }
            for (const conflict of card.conflicts) if (typeof conflict === 'string') add('p', conflict, details);
        }
        panel.replaceChildren(body); panel.hidden = false;
        sourceSession = card.session_id; sourceAgent = participant.identity; sourceSequence = event.sequence;
        sourcePhase = card.phase; sourceHeading = heading;
    }

    function getRoomName() {
        const sel = document.getElementById('modelSelect');
        const v = sel ? sel.value : 'deepseek';
        return 'angeleno-jo';
    }

    async function fetchBounded(url, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        try { return await fetch(url, { ...options, signal: controller.signal }); }
        finally { clearTimeout(timeout); }
    }

    async function getToken() {
        const identity = 'user-' + Math.random().toString(36).substring(2, 8);
        const roomName = getRoomName();
        const resp = await fetchBounded(TOKEN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: roomName, identity: identity, name: '试用者' }),
        });
        if (!resp.ok) {
            throw new Error('暂时无法建立通话，请稍后重试');
        }
        const data = await resp.json();
        if (!data.token) throw new Error('暂时无法建立通话，请稍后重试');
        if (!data.livekit_url) throw new Error('通话地址缺失');
        return data;
    }

    let room = null;
    let connected = false;
    let connecting = false;
    let localIdentity = '';
    let livekitReady = false;
    let agentTimer = null;
    let callGeneration = 0;
    let closingRoom = Promise.resolve();

    function clearCall(state = 'disconnected', message = '') {
        const previous = room;
        room = null;
        callGeneration += 1;
        if (sourcePhase === 'checking' && sourceHeading) {
            sourceHeading.textContent = '已取消'; sourcePhase = 'result';
        }
        connected = false;
        connecting = false;
        clearTimeout(agentTimer);
        clearToast();
        muteButton.hidden = true;
        updateMuteControl(true);
        callLabel.textContent = '开始通话';
        micButton.setAttribute('aria-label', '开始对话');
        micButton.classList.remove('connected', 'speaking');
        stopTimer();
        disconnectMicFromAnalyser();
        document.getElementById('transcript').textContent = '';
        remoteAudio.srcObject = null;
        // Stop capture immediately; SDK leave/transport teardown is asynchronous.
        if (previous && previous.localParticipant) {
            previous.localParticipant.audioTrackPublications.forEach(pub => {
                const track = pub.track && pub.track.mediaStreamTrack;
                if (track) track.stop();
            });
        }
        setStatus(state, message);
        return previous;
    }

    function closeRoom(previous) {
        if (previous) {
            try { closingRoom = Promise.resolve(previous.disconnect()).catch(err => console.warn('room close', err)); }
            catch (err) { console.warn('room close', err); }
        }
        return closingRoom;
    }

    async function connect() {
        if (connected || connecting) return;
        const generation = ++callGeneration;
        resetSourceCard();
        clearToast();
        timerEl.textContent = '00:00';
        connecting = true;
        ensureAudioGraph();
        setStatus('connecting');
        callLabel.textContent = '挂断';
        micButton.setAttribute('aria-label', '取消连接');
        let currentRoom = null;
        const isCurrent = () => generation === callGeneration && room === currentRoom;
        try {
            await closingRoom;
            if (generation !== callGeneration) return;
            const health = await fetchBounded('/healthz').then(r => r.json());
            if (generation !== callGeneration) return;
            if (health.persona_label) updatePersona(health);
            if (!health.ready) throw new Error('通话服务未就绪');
            const connection = await getToken();
            if (generation !== callGeneration) return;
            currentRoom = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
            room = currentRoom;
            // Every asynchronous callback belongs only to the dial that created it.
            const on = (event, handler) => currentRoom.on(event, (...args) => {
                if (isCurrent()) handler(...args);
            });
            on(LivekitClient.RoomEvent.Connected, () => {
                connected = true;
                localIdentity = currentRoom.localParticipant ? currentRoom.localParticipant.identity : '';
                setStatus('connecting');
                agentTimer = setTimeout(() => {
                    if (isCurrent()) failCall('通话暂时无法开始，请稍后重试');
                }, 20000);
                micButton.setAttribute('aria-label', '挂断');
                callLabel.textContent = '挂断';
                muteButton.hidden = false;
                micButton.classList.add('connected');
                startTimer();
            });
            on(LivekitClient.RoomEvent.Disconnected, () => clearCall());
            function agentState(participant) {
                if (!isCurrent() || !participant || !participant.isAgent) return;
                const state = participant.attributes['lk.agent.state'];
                if (!state || state === 'initializing') { setStatus('connecting'); return; }
                clearTimeout(agentTimer);
                if (state === 'thinking') setStatus('connected', modelDisplayName() + ' 正在回应');
                else setStatus('connected', modelDisplayName() + (state === 'speaking' ? ' 正在回应' : ' 在听'));
            }
            on(LivekitClient.RoomEvent.ParticipantConnected, agentState);
            on(LivekitClient.RoomEvent.ParticipantAttributesChanged, (_, participant) => agentState(participant));
            on(LivekitClient.RoomEvent.ParticipantDisconnected, participant => {
                if (participant.isAgent) failCall('通话已停止，请重新拨号');
            });
            on(LivekitClient.RoomEvent.Reconnecting, () => setStatus('connecting'));
            on(LivekitClient.RoomEvent.Reconnected, () => setStatus('connected'));
            on(LivekitClient.RoomEvent.TrackSubscribed, track => {
                if (track.kind !== LivekitClient.Track.Kind.Audio) return;
                track.attach(remoteAudio);
                remoteAudio.muted = false;
                const playing = remoteAudio.play ? remoteAudio.play() : null;
                if (playing && typeof playing.catch === 'function') {
                    playing.catch(() => { if (isCurrent()) failCall('音频无法播放，请重新拨号'); });
                }
            });
            on(LivekitClient.RoomEvent.TrackUnsubscribed, track => {
                if (track.kind !== LivekitClient.Track.Kind.Audio) return;
                try { track.detach(remoteAudio); } catch (_) {}
                remoteAudio.srcObject = null;
            });
            on(LivekitClient.RoomEvent.ActiveSpeakersChanged, speakers => {
                micButton.classList.toggle('speaking', speakers.some(s => s.identity !== localIdentity));
            });
            on(LivekitClient.RoomEvent.TranscriptionReceived, segments => {
                const text = segments.map(segment => segment.text).join('');
                if (text) showTranscript(text);
            });
            on(LivekitClient.RoomEvent.DataReceived, (...args) => {
                receiveSourceCard(...args); receiveTurnStatus(...args);
            });
            await currentRoom.connect(connection.livekit_url, connection.token, { rtcConfig: { iceServers: [] } });
            if (!isCurrent()) { await currentRoom.disconnect(); return; }
            currentRoom.remoteParticipants.forEach(agentState);
            try {
                await currentRoom.localParticipant.setMicrophoneEnabled(true);
                if (!isCurrent()) { await currentRoom.disconnect(); return; }
                const pubs = currentRoom.localParticipant.audioTrackPublications;
                const pub = pubs && pubs.size ? pubs.values().next().value : null;
                if (pub && pub.track && pub.track.mediaStreamTrack) connectMicToAnalyser(pub.track.mediaStreamTrack);
            } catch (err) {
                if (!isCurrent()) { await currentRoom.disconnect(); return; }
                throw new Error('请允许浏览器使用麦克风后重新拨号');
            }
            connecting = false;
        } catch (err) {
            if (generation !== callGeneration) return;
            console.error(err);
            failCall(err.name === 'AbortError' ? '服务响应超时，请稍后重试' : (err.message || '连接失败，请重新拨号'));
        }
    }

    function failCall(message) { return closeRoom(clearCall('error', message)); }
    function disconnect() { return closeRoom(clearCall()); }
    muteButton.addEventListener('click', async () => {
        const currentRoom = room;
        const generation = callGeneration;
        if (!currentRoom) return;
        const enabled = !currentRoom.localParticipant.isMicrophoneEnabled;
        try {
            await currentRoom.localParticipant.setMicrophoneEnabled(enabled);
            if (room !== currentRoom || generation !== callGeneration) return;
            updateMuteControl(enabled);
        } catch (_) {
            if (room === currentRoom && generation === callGeneration) failCall('麦克风不可用，请重新拨号');
        }
    });
    micButton.addEventListener('click', () => {
        connected || connecting ? disconnect() : connect();
    });

    // Idle health responses cannot overwrite a newer call or its terminal state.
    function checkLiveKit() {
        if (connected || connecting) return;
        const generation = callGeneration;
        fetchBounded('/healthz')
            .then(r => r.json())
            .then(health => {
                if (connected || connecting || generation !== callGeneration) return;
                if (health.persona_label) updatePersona(health);
                livekitReady = !!health.ready;
                setStatus(health.ready ? 'ready' : 'error', health.ready ? '' : '通话服务未就绪');
            })
            .catch(() => {
                if (!connected && !connecting && generation === callGeneration) setStatus('error', '通话服务未就绪');
            });
    }


    setStatus('connecting');
    checkLiveKit();
    setInterval(checkLiveKit, 15000);
}
bootAngeleno();
</script></body></html>
